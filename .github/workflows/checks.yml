name: Offline checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==8.4.2 requests==2.32.5 PyYAML==6.0.2 Pillow==11.3.0 av==15.1.0 modelscope==1.29.2
      - run: python scripts/check_static.py
      - run: python -m pytest -q
